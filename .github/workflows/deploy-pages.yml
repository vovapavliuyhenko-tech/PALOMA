# Статический сайт PALOMA → GitHub Pages
# После первого push: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новый деплой отменяет предыдущий: шаг deploy-pages периодически зависает
# на публикации, и при cancel-in-progress: false очередь встаёт целиком —
# свежий пуш не может доехать до сайта, пока висяк не отвалится по таймауту.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url || steps.deploy4.outputs.page_url }}
    runs-on: ubuntu-latest
    # Успешный деплой укладывается в ~30 секунд. Лимит с запасом на три
    # попытки ниже: у deploy-pages свой внутренний таймаут ~10 минут, поэтому
    # при 10 минутах на job повторы просто не успевали запуститься.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Раньше здесь стояло `path: .` — на сайт уезжала ВСЯ папка, включая
      # исходники облачной функции, схему базы и служебные скрипты. Всё это
      # открывалось по прямой ссылке любому: paloma.website/paykeeper/index.js
      # отдавал 200. Публикуем только то, из чего состоит сам сайт.
      - name: Убрать служебное из публикации
        run: |
          # Папки: бэкенд, схема базы, мёртвый Next.js и Netlify, сборочные
          # скрипты, тесты, внутренние заготовки страниц и документация.
          rm -rf paykeeper database src tools scripts tests \
                 docs public netlify partials internals .github
          # Сборочные скрипты, конфиги и мусор в корне. CNAME и .nojekyll
          # трогать нельзя: первый держит домен, второй — отдачу как есть.
          rm -f ./*.mjs ./*.bak ./*.ps1
          rm -f package.json package-lock.json tsconfig.json next.config.ts \
                README.md AGENTS.md CLAUDE.md PALOMA_full_rebuild_cursor_prompt.md \
                PHOTO_USAGE_MAP.md netlify.toml .gitignore

      # Предохранитель: если что-то из перечисленного всё же осталось —
      # роняем сборку, а не выкладываем молча. Дешевле сломанный деплой,
      # чем ещё одна утечка.
      - name: Проверить, что секретного не осталось
        run: |
          found=$(find . -path ./.git -prune -o \
            \( -name '*.sql' -o -name '*.zip' -o -name 'lost-order-*.json' \
               -o -name '*.mjs' -o -name '*.bak' -o -name '*.ps1' \
               -o -name 'package-lock.json' \) -print)
          if [ -n "$found" ]; then
            echo "В публикацию попали служебные файлы:"; echo "$found"; exit 1
          fi
          echo "Чисто: служебных файлов в артефакте нет."

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub Pages периодически отдаёт транзиентную ошибку — публикуем
      # с авто-ретраем, чтобы не пушить ручные retrigger-коммиты.
      #
      # Паузы были 30 и 45 секунд, и этого не хватало на самый частый отказ:
      # «Deployment request failed … due to in progress deployment. Please
      # cancel <прошлый коммит> first or wait for it to complete». Публикация
      # предыдущего коммита на стороне GitHub живёт дольше, чем свой workflow
      # (тот показывает «успешно» за полминуты), и следующая сборка упирается
      # в неё. Три попытки укладывались в полторы минуты и падали все три.
      # Ждём заметно дольше — время дешевле неопубликованного сайта.
      - name: Deploy (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 120

      - name: Deploy (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 180

      - name: Deploy (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: sleep 240

      - name: Deploy (attempt 4)
        id: deploy4
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        uses: actions/deploy-pages@v4
